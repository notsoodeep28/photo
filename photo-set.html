<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#0B0B0F">
    <meta name="description" content="Browse photographs from Not Soo Deep Photo.">
    <title>Photo Set - Not Soo Deep Photo</title>
    <script src="theme.js"></script>
    <link rel="stylesheet" href="styles.css">
    <script src="photo-sets.js" defer></script>
    <script src="photo-masonry.js" defer></script>
    <script src="photo-viewer.js" defer></script>
    <script src="photo-library.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="Not Soo Deep Photo home">NOT SOO DEEP <span>PHOTO</span></a>
      <div class="site-controls">
        <nav class="site-nav" aria-label="Main navigation">
          <a href="projects.html" aria-current="page">Photo sets</a>
          <a href="about.html">About</a>
        </nav>
        <button class="theme-toggle" type="button" aria-label="Turn light theme on" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path class="bulb-glass" d="M9 18h6m-5 3h4m-2-19a7 7 0 0 0-4 12.75c.6.4 1 1 1 1.75h6c0-.75.4-1.35 1-1.75A7 7 0 0 0 12 2Z" />
            <path d="M12 1V0m8 4 1-1m-18 1L2 3m18 8h2M2 11H0" />
          </svg>
        </button>
      </div>
    </header>

    <main id="main" class="page-main" data-photo-set-page>
      <header class="page-heading">
        <p class="eyebrow">Loading photo set</p>
        <h1>Photo set</h1>
        <p>Photographs from Not Soo Deep Photo.</p>
      </header>
      <p data-photo-library-error hidden role="status"></p>
      <section class="photo-grid" aria-label="Photographs"></section>
    </main>

    <dialog class="photo-dialog" aria-label="Photo details">
      <button class="photo-dialog-close" type="button" aria-label="Close photo details">&times;</button>
      <figure>
        <img class="photo-dialog-image" alt="">
        <figcaption class="photo-dialog-caption"></figcaption>
      </figure>
    </dialog>

    <footer class="site-footer">
      <a href="projects.html">All photo sets <span aria-hidden="true">&larr;</span></a>
      <a href="about.html">About the work <span aria-hidden="true">&rarr;</span></a>
    </footer>
  </body>
</html>
