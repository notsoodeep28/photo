<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#0B0B0F">
    <meta name="description" content="Black-and-white digital photography from Not Soo Deep Photo.">
    <title>Black and White - Not Soo Deep Photo</title>
    <script src="theme.js"></script>
    <link rel="stylesheet" href="styles.css">
    <script src="photo-viewer.js" defer></script>
    <script src="photo-masonry.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="Not Soo Deep Photo home">NOT SOO DEEP <span>PHOTO</span></a>
      <div class="site-controls">
        <nav class="site-nav" aria-label="Main navigation">
          <a href="projects.html" aria-current="page">Photo sets</a>
          <a href="about.html">About</a>
        </nav>
        <button class="theme-toggle" type="button" aria-label="Turn light theme on" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path class="bulb-glass" d="M9 18h6m-5 3h4m-2-19a7 7 0 0 0-4 12.75c.6.4 1 1 1 1.75h6c0-.75.4-1.35 1-1.75A7 7 0 0 0 12 2Z" />
            <path d="M12 1V0m8 4 1-1m-18 1L2 3m18 8h2M2 11H0" />
          </svg>
        </button>
      </div>
    </header>

    <main id="main" class="page-main">
      <header class="page-heading">
        <p class="eyebrow">Digital / 5 photographs</p>
        <h1>Black and white</h1>
        <p>Without color but full of life: textures, shapes, light, and shadow.</p>
      </header>

      <section class="photo-grid" aria-label="Black-and-white photographs">
        <figure>
          <button class="photo-trigger" type="button">
            <img src="images/bnw/11-1-26-11.jpg" width="2706" height="4811" alt="A person in a Patriots jersey, photographed from behind." loading="lazy" decoding="async">
          </button>
          <figcaption class="photo-description">Digital</figcaption>
        </figure>
        <figure>
          <button class="photo-trigger" type="button">
            <img src="images/bnw/beachdays-14.jpg" width="3528" height="1984" alt="A small boat crossing the water beneath distant mountains." loading="lazy" decoding="async">
          </button>
          <figcaption class="photo-description">Digital</figcaption>
        </figure>
        <figure>
          <button class="photo-trigger" type="button">
            <img src="images/bnw/20260201-DSV_8554.jpg" width="4928" height="3264" alt="Black-and-white digital photograph from the collection." loading="lazy" decoding="async">
          </button>
          <figcaption class="photo-description">Digital</figcaption>
        </figure>
        <figure>
          <button class="photo-trigger" type="button">
            <img src="images/bnw/10-1-26-02.jpg" width="3420" height="2565" alt="Black-and-white digital photograph from the collection." loading="lazy" decoding="async">
          </button>
          <figcaption class="photo-description">Digital</figcaption>
        </figure>
        <figure>
          <button class="photo-trigger" type="button">
            <img src="images/bnw/10-1-26-16.jpg" width="2293" height="2293" alt="Black-and-white digital photograph from the collection." loading="lazy" decoding="async">
          </button>
          <figcaption class="photo-description">Digital</figcaption>
        </figure>
      </section>
    </main>

    <dialog class="photo-dialog" aria-label="Photo details">
      <button class="photo-dialog-close" type="button" aria-label="Close photo details">Close</button>
      <figure>
        <img class="photo-dialog-image" alt="">
        <figcaption class="photo-dialog-caption"></figcaption>
      </figure>
    </dialog>

    <footer class="site-footer">
      <a href="projects.html">All photo sets <span aria-hidden="true">&larr;</span></a>
      <a href="film.html">Next: shot on film <span aria-hidden="true">&rarr;</span></a>
    </footer>
  </body>
</html>
